<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="/__uifb/review-page.css">

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p>항목마다 <strong>좋음 / 수정 필요 / 되돌리기</strong> 중 하나를 고르고, 필요하면 한 줄 남겨 주세요. 선택은 이 프로젝트의 <code>.ui-feedback/</code> 폴더에 바로 저장됩니다. 이미지를 누르면 크게 보이고, 크게 본 이미지 위를 누르면 그 위치에 핀을 찍어 메모할 수 있습니다.</p>
  </header>
  <div class="mode" id="mode" data-auto="off"><span class="dot"></span><div><b id="modeTitle">확인 중…</b><span class="sub" id="modeSub"></span></div></div>
  <div class="status" id="status"><span class="pill" id="count"></span><span id="conn">불러오는 중…</span></div>
  <div id="items" style="display:grid;gap:20px"></div>
  <section class="item footer">
    <h2>전체 의견</h2>
    <textarea id="overall" rows="3" placeholder="방향, 색감, 추가로 바꾸고 싶은 점 등"></textarea>
    <button class="send" id="done" type="button">리뷰 완료 표시</button>
    <p class="note" id="doneNote"></p>
  </section>
</div>
<dialog id="zoom" aria-label="이미지 크게 보기">
  <div class="zbar">
    <span><b id="zoomName"></b> · 이미지를 누르면 그 위치에 메모 핀을 남깁니다 · 핀치나 Ctrl+휠로 확대</span>
    <span class="zoomctl" role="group" aria-label="배율">
      <button class="ghost" type="button" data-zoom="fit">맞춤</button>
      <button class="ghost" type="button" data-zoom="1">100%</button>
      <button class="ghost" type="button" data-zoom="1.5">150%</button>
      <button class="ghost" type="button" data-zoom="2">200%</button>
      <button class="ghost" id="zoomClose" type="button">닫기</button>
    </span>
  </div>
  <div class="stage" id="zoomStage" data-fit="true"><div class="pinwrap" id="zoomWrap"><img id="zoomImg" alt=""></div></div>
  <ul class="pinlist" id="zoomPins"></ul>
</dialog>

<script>
// ── 매 라운드 이 블록만 바꾼다 ──
const REVIEW = {
  project: '__PROJECT__',
  round: 1,
  session: '__SESSION__', // 이 리뷰를 반영하는 세션 이름(register-session --name). Codex 세션이면 완료 표시 때 바로 깨워 이어서 작업하게 한다
  scale: 2, // 캡처 배율. capture-2x.js로 찍었으면 2, page.screenshot으로 찍었으면 1
  items: [
    // { id: 'write', title: '작성 화면 재배치', changes: ['바뀐 점 한 줄', '…'], before: ['before-write.png'], after: ['after-write.png'] },
    // 번호 상자를 쓸 때: 이미지 자리에 capture-2x.js 가 돌려준 image 객체를 그대로 넣고, changes 를 같은 번호로 시작한다.
    // { id: 'list', title: '목록 정리', changes: ['1 제목 줄을 한 줄로', '2 버튼을 오른쪽 위로'],
    //   before: [{ file: 'before-list.png', marks: [{ n: 1, x: 3, y: 10, w: 60, h: 8 }], source: { url: '/list', viewport: '1440×900', theme: 'light', at: '…' } }],
    //   after: [{ file: 'after-list.png', marks: [...], source: {...} }] },
    // 직접 찍지 않은 이미지(과거 캡처·다른 도구)는 source: { direct: false, note: '10/7 기존 도구 캡처, 창 크기 다름' }, marks 는 눈으로 % 를 적는다.
  ],
};
// ── 여기까지 ──
</script>
<!-- 화면 동작은 리뷰 서버가 내보내는 공용 파일을 쓴다. 고칠 때는 assets/review-page.js·review-page.css 를 고친다. -->
<script src="/__uifb/review-page.js"></script>
<!-- 대화/피드백 창은 앱 화면과 같은 위젯(assets/app-widget.js)을 리뷰 서버가 내보낸다. 이 페이지에는 대화 코드를 두지 않는다. -->
<script>window.__uifbConfig = { context: 'review', round: REVIEW.round, label: `${REVIEW.round}차 리뷰`, pick: true };</script>
<script src="/__uifb/widget.js" defer></script>
</html>
