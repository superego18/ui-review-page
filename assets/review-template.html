<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* Layout: one column of review items, each = before/after images + a verdict row */
  :root {
    --paper: #f6f5f1; --sheet: #ffffff; --ink: #1c1b18; --ink-2: #5a5852; --ink-3: #8f8c84;
    --rule: rgba(28,27,24,.12); --accent: #4f46e5; --accent-soft: #eef0ff;
    --good: #15803d; --good-soft: #e9f7ee; --warn: #b45309; --warn-soft: #fdf3e2; --bad: #b91c1c; --bad-soft: #fdeceb;
    --sans: "IBM Plex Sans KR", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #171614; --sheet: #211f1c; --ink: #ecebe6; --ink-2: #b4b1a8; --ink-3: #85827a;
    --rule: rgba(255,255,255,.1); --accent: #8b87ff; --accent-soft: #26244a;
    --good: #5fd08a; --good-soft: #17301f; --warn: #f0b35a; --warn-soft: #34270f; --bad: #f28a84; --bad-soft: #3a1c1a; color-scheme: dark } }
  :root[data-theme="dark"] {
    --paper: #171614; --sheet: #211f1c; --ink: #ecebe6; --ink-2: #b4b1a8; --ink-3: #85827a;
    --rule: rgba(255,255,255,.1); --accent: #8b87ff; --accent-soft: #26244a;
    --good: #5fd08a; --good-soft: #17301f; --warn: #f0b35a; --warn-soft: #34270f; --bad: #f28a84; --bad-soft: #3a1c1a; color-scheme: dark }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 32px 64px; display: grid; gap: 20px; }
  header h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 6px; text-wrap: balance; }
  header p { color: var(--ink-2); margin: 0; line-height: 1.6; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .pill { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sheet); box-shadow: 0 0 0 1px var(--rule); font-variant-numeric: tabular-nums; }
  .item { background: var(--sheet); border-radius: 10px; box-shadow: 0 0 0 1px var(--rule); padding: 20px; display: grid; gap: 14px; min-width: 0; }
  .item h2 { font-size: 17px; font-weight: 600; margin: 0; display: flex; gap: 10px; align-items: baseline; }
  .item h2 .k { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-weight: 400; }
  .changes { margin: 0; padding-left: 18px; color: var(--ink-2); line-height: 1.65; font-size: 14px; }
  .shots { display: grid; gap: 12px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  figure { margin: 0; min-width: 0; display: grid; gap: 6px; }
  figcaption { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
  figcaption b { font-weight: 600; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
  .before b { background: var(--paper); color: var(--ink-2); box-shadow: 0 0 0 1px var(--rule); }
  .after b { background: var(--accent-soft); color: var(--accent); }
  figure button { padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 6px; display: block; width: 100%; }
  figure .pinwrap { width: 100%; }
  figure img { display: block; width: 100%; border-radius: 6px; outline: 1px solid var(--rule); outline-offset: -1px; }
  figure.tall { justify-items: start; }
  figure.tall button { width: auto; max-width: 280px; }
  figure.tall img { max-height: 640px; width: auto; max-width: 100%; }
  .verdict { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--rule); }
  .opt { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); cursor: pointer; transition: background-color .15s, color .15s, transform .1s; }
  .opt:active { transform: scale(.97); }
  .opt[aria-pressed="true"][data-v="good"] { background: var(--good-soft); color: var(--good); border-color: transparent; font-weight: 600; }
  .opt[aria-pressed="true"][data-v="tweak"] { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 600; }
  .opt[aria-pressed="true"][data-v="revert"] { background: var(--bad-soft); color: var(--bad); border-color: transparent; font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; padding: 9px 11px; resize: vertical; min-height: 44px; line-height: 1.5; }
  textarea:focus, .opt:focus-visible, .send:focus-visible, figure button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .saved { font-size: 12px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
  .footer { display: grid; gap: 10px; }
  .send { justify-self: start; font: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 8px; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; }
  .send:disabled { opacity: .5; cursor: default; }
  .note { font-size: 13px; color: var(--ink-3); margin: 0; }
  .mode { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.55; }
  .mode b { display: block; font-size: 14px; }
  .mode .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; background: currentColor; }
  .mode[data-auto="on"] { background: var(--good-soft); color: var(--good); }
  .mode[data-auto="off"] { background: var(--warn-soft); color: var(--warn); }
  .mode span.sub { color: var(--ink-2); }
  dialog { border: 0; padding: 16px; background: var(--sheet); color: var(--ink); border-radius: 10px; width: min(96vw, 1600px); max-width: 96vw; max-height: 94vh; overflow: hidden; box-sizing: border-box; display: none; flex-direction: column; }
  dialog[open] { display: flex; }
  .stage { overflow: auto; touch-action: none; overscroll-behavior: contain; flex: 1; min-height: 0; max-height: calc(94vh - 160px); border-radius: 6px; background: var(--paper); }
  .zoomctl { display: flex; gap: 4px; align-items: center; }
  .zoomctl .ghost[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: transparent; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .zbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--ink-2); }
  .zbar b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
  .pinwrap { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
  .pinwrap img { display: block; max-width: 100%; }
  dialog .pinwrap img { border-radius: 6px; cursor: crosshair; }
  .stage[data-fit="true"] .pinwrap img { max-height: calc(94vh - 180px); width: auto; }
  .stage[data-fit="false"] .pinwrap, .stage[data-fit="false"] .pinwrap img { max-width: none; }
  .pin { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 11px/22px var(--sans); text-align: center; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.35); pointer-events: none; }
  figure .pin { width: 16px; height: 16px; font-size: 9px; line-height: 16px; }
  .pinlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .pinlist li { display: flex; gap: 8px; align-items: center; }
  .pinlist .num { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 11px/20px var(--sans); text-align: center; }
  .pinlist input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; }
  .pinlist .src { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex-shrink: 0; }
  .ghost { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); cursor: pointer; }
  .pinsummary { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
  .pinsummary .num { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 9px/16px var(--sans); text-align: center; margin-right: 6px; vertical-align: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .chatbtn { position: fixed; right: 20px; bottom: 20px; z-index: 20; font: inherit; font-weight: 600; font-size: 14px; padding: 11px 16px; border-radius: 999px; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: flex; gap: 8px; align-items: center; }
  .chatbtn .badge { min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 5px; }
  .chat { position: fixed; right: 20px; bottom: 76px; z-index: 20; width: min(380px, calc(100vw - 32px)); height: min(560px, calc(100vh - 120px)); background: var(--sheet); border-radius: 12px; box-shadow: 0 0 0 1px var(--rule), 0 12px 32px rgba(0,0,0,.18); display: flex; flex-direction: column; overflow: hidden; }
  .chat header { padding: 12px 14px; border-bottom: 1px solid var(--rule); }
  .chat header b { font-size: 14px; }
  .chat header p { margin: 2px 0 0; font-size: 12px; line-height: 1.45; }
  .chat header p[data-auto="on"] { color: var(--good); }
  .chat header p[data-auto="off"] { color: var(--warn); }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
  .msg { max-width: 85%; padding: 8px 11px; border-radius: 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .msg.agent { align-self: flex-start; background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); border-bottom-left-radius: 3px; }
  .msg code { font-family: var(--mono); font-size: 12px; background: rgba(127,127,127,.15); padding: 0 4px; border-radius: 4px; }
  .msg time { display: block; font-size: 10px; opacity: .7; margin-top: 3px; }
  .waiting { align-self: flex-start; font-size: 12px; color: var(--ink-3); }
  .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--rule); }
  .compose textarea { min-height: 40px; max-height: 120px; resize: none; }
  .compose button { flex-shrink: 0; white-space: nowrap; font: inherit; font-weight: 600; font-size: 14px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; }
  .target { display: flex; gap: 4px; padding: 8px 10px 0; border-top: 1px solid var(--rule); align-items: center; font-size: 12px; color: var(--ink-3); }
  .target button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); cursor: pointer; }
  .target button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: transparent; }
  .compose { border-top: 0 !important; }
  .tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
  .msg.user .tag { background: rgba(255,255,255,.22); color: #fff; }
  .msg.agent .tag { background: var(--paper); color: var(--ink-2); }
  .divider { align-self: stretch; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); margin: 6px 0 2px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .empty { margin: auto; text-align: center; font-size: 13px; color: var(--ink-3); line-height: 1.6; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p>항목마다 <strong>좋음 / 수정 필요 / 되돌리기</strong> 중 하나를 고르고, 필요하면 한 줄 남겨 주세요. 선택은 이 프로젝트의 <code>.ui-feedback/</code> 폴더에 바로 저장됩니다. 이미지를 누르면 크게 보이고, 크게 본 이미지 위를 누르면 그 위치에 핀을 찍어 메모할 수 있습니다.</p>
  </header>
  <div class="mode" id="mode" data-auto="off"><span class="dot"></span><div><b id="modeTitle">확인 중…</b><span class="sub" id="modeSub"></span></div></div>
  <div class="status" id="status"><span class="pill" id="count"></span><span id="conn">불러오는 중…</span></div>
  <div id="items" style="display:grid;gap:20px"></div>
  <section class="item footer">
    <h2>전체 의견</h2>
    <textarea id="overall" rows="3" placeholder="방향, 색감, 추가로 바꾸고 싶은 점 등"></textarea>
    <button class="send" id="done" type="button">리뷰 완료 표시</button>
    <p class="note" id="doneNote"></p>
  </section>
</div>
<button class="chatbtn" id="chatBtn" type="button" aria-expanded="false" aria-controls="chat">대화<span class="badge" id="chatBadge" hidden></span></button>
<section class="chat" id="chat" hidden aria-label="작업 세션과 대화">
  <header><b>작업 세션과 대화</b><p id="chatMode" data-auto="off"></p></header>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="target" role="group" aria-label="고칠 대상">
    고칠 대상
    <button type="button" data-target="system" aria-pressed="true">작업 중인 시스템</button>
    <button type="button" data-target="skill" aria-pressed="false">스킬(리뷰 방식)</button>
  </div>
  <form class="compose" id="compose">
    <textarea id="chatInput" rows="1" placeholder="질문이나 요청 · Enter 보내기" aria-label="메시지"></textarea>
    <button type="submit">보내기</button>
  </form>
</section>
<dialog id="zoom" aria-label="이미지 크게 보기">
  <div class="zbar">
    <span><b id="zoomName"></b> · 이미지를 누르면 그 위치에 메모 핀을 남깁니다 · 핀치나 Ctrl+휠로 확대</span>
    <span class="zoomctl" role="group" aria-label="배율">
      <button class="ghost" type="button" data-zoom="fit">맞춤</button>
      <button class="ghost" type="button" data-zoom="1">100%</button>
      <button class="ghost" type="button" data-zoom="1.5">150%</button>
      <button class="ghost" type="button" data-zoom="2">200%</button>
      <button class="ghost" id="zoomClose" type="button">닫기</button>
    </span>
  </div>
  <div class="stage" id="zoomStage" data-fit="true"><div class="pinwrap" id="zoomWrap"><img id="zoomImg" alt=""></div></div>
  <ul class="pinlist" id="zoomPins"></ul>
</dialog>

<script>
// ── 매 라운드 이 블록만 바꾼다 ──
const REVIEW = {
  project: '__PROJECT__',
  round: 1,
  scale: 2, // 캡처 배율. capture-2x.js로 찍었으면 2, page.screenshot으로 찍었으면 1
  items: [
    // { id: 'write', title: '작성 화면 재배치', changes: ['바뀐 점 한 줄', '…'], before: ['before-write.png'], after: ['after-write.png'] },
  ],
};
// ── 여기까지 ──
const ITEMS = REVIEW.items;
const API = '/api/feedback?round=' + REVIEW.round;
const LABELS = { good: '좋음', tweak: '수정 필요', revert: '되돌리기' };
const state = {};
const $ = (s) => document.querySelector(s);

function pinsOf(itemId) {
  return state[itemId]?.pins || [];
}

function drawPins(wrap, itemId, file) {
  wrap.querySelectorAll('.pin').forEach((p) => p.remove());
  pinsOf(itemId).forEach((pin, i) => {
    if (pin.image !== file) return;
    const dot = document.createElement('span');
    dot.className = 'pin';
    dot.textContent = String(i + 1);
    dot.style.left = pin.x + '%';
    dot.style.top = pin.y + '%';
    wrap.append(dot);
  });
}

function shot(file, kind, itemId) {
  const f = document.createElement('figure');
  f.className = kind;
  const cap = document.createElement('figcaption');
  cap.innerHTML = `<b>${kind === 'before' ? '전' : '후'}</b>`;
  cap.append(file.replace('.png', ''));
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.setAttribute('aria-label', '크게 보고 핀 메모 남기기');
  const wrap = document.createElement('span');
  wrap.className = 'pinwrap';
  const img = document.createElement('img');
  img.src = file; img.alt = file; img.loading = 'lazy';
  img.onload = () => { if (img.naturalHeight > img.naturalWidth * 1.3) f.classList.add('tall'); };
  wrap.append(img);
  drawPins(wrap, itemId, file);
  btn.append(wrap);
  btn.onclick = () => openZoom(itemId, file);
  f.append(cap, btn);
  return f;
}

let zoomCtx = null;
let pinT;

function savePins(itemId) {
  clearTimeout(pinT);
  pinT = setTimeout(() => save(itemId, { pins: pinsOf(itemId) }), 500);
}

function renderZoomPins() {
  const { itemId, file } = zoomCtx;
  drawPins($('#zoomWrap'), itemId, file);
  const list = $('#zoomPins');
  list.textContent = '';
  pinsOf(itemId).forEach((pin, i) => {
    if (pin.image !== file) return;
    const li = document.createElement('li');
    const num = document.createElement('span');
    num.className = 'num'; num.textContent = String(i + 1);
    const input = document.createElement('input');
    input.value = pin.note || '';
    input.placeholder = '이 위치에 대한 의견';
    input.setAttribute('aria-label', `핀 ${i + 1} 메모`);
    input.oninput = () => { pin.note = input.value; savePins(itemId); };
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'ghost'; del.textContent = '삭제';
    del.onclick = () => {
      state[itemId].pins = pinsOf(itemId).filter((p) => p !== pin);
      savePins(itemId);
      renderZoomPins();
    };
    li.append(num, input, del);
    list.append(li);
  });
}

let zoomScale = 'fit';

const MIN_ZOOM = 0.1;
const MAX_ZOOM = 8;

function baseWidth() {
  const img = $('#zoomImg');
  return img.naturalWidth / (REVIEW.scale || 1);
}

function currentScale() {
  return zoomScale === 'fit' ? $('#zoomImg').getBoundingClientRect().width / baseWidth() : zoomScale;
}

// anchor: 화면 좌표(clientX, clientY). 그 지점 아래의 이미지 위치가 확대 후에도 같은 자리에 오게 스크롤을 맞춘다.
function applyZoom(scale, anchor) {
  const img = $('#zoomImg');
  const stage = $('#zoomStage');
  let fx = 0, fy = 0, ax = 0, ay = 0;
  if (anchor && scale !== 'fit') {
    const r = img.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    fx = (anchor.x - r.left) / r.width;
    fy = (anchor.y - r.top) / r.height;
    ax = anchor.x - sr.left;
    ay = anchor.y - sr.top;
  }
  if (scale !== 'fit') scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale));
  zoomScale = scale;
  stage.dataset.fit = String(scale === 'fit');
  img.style.width = scale === 'fit' ? '' : Math.round(baseWidth() * scale) + 'px';
  if (anchor && scale !== 'fit') {
    const r = img.getBoundingClientRect();
    stage.scrollLeft += r.left - stage.getBoundingClientRect().left + fx * r.width - ax;
    stage.scrollTop += r.top - stage.getBoundingClientRect().top + fy * r.height - ay;
  }
  document.querySelectorAll('[data-zoom]').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.zoom === String(scale)));
  });
}

document.querySelectorAll('[data-zoom]').forEach((b) => {
  b.onclick = () => applyZoom(b.dataset.zoom === 'fit' ? 'fit' : Number(b.dataset.zoom));
});

// Ctrl+휠, 트랙패드 핀치(브라우저가 ctrlKey 휠로 보냄): 움직인 만큼 연속으로 확대·축소
$('#zoomStage').addEventListener('wheel', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  applyZoom(currentScale() * Math.exp(-delta * 0.0025), { x: e.clientX, y: e.clientY });
}, { passive: false });

// 터치: 두 손가락은 핀치 확대·축소(두 손가락 가운데 중심), 한 손가락은 이동.
// 확대 영역은 touch-action: none 이라 브라우저 대신 여기서 둘 다 처리한다.
const touches = new Map();
let pinch = null;
let moved = false;
let gestureEndedAt = 0;
const stageEl = $('#zoomStage');
stageEl.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 1) moved = false;
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: currentScale() };
    moved = true;
  }
});
stageEl.addEventListener('pointermove', (e) => {
  const prev = touches.get(e.pointerId);
  if (!prev) return;
  const now = { x: e.clientX, y: e.clientY };
  touches.set(e.pointerId, now);
  if (pinch && touches.size === 2) {
    const [a, b] = [...touches.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    applyZoom(pinch.scale * (dist / pinch.dist), { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  } else if (touches.size === 1) {
    const dx = now.x - prev.x, dy = now.y - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 0) {
      stageEl.scrollLeft -= dx;
      stageEl.scrollTop -= dy;
    }
    if (Math.hypot(dx, dy) > 3) moved = true;
  }
});
function endTouch(e) {
  if (!touches.has(e.pointerId)) return;
  touches.delete(e.pointerId);
  if (moved) gestureEndedAt = Date.now();
  if (touches.size < 2) pinch = null;
}
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => stageEl.addEventListener(t, endTouch));

function openZoom(itemId, file) {
  zoomCtx = { itemId, file };
  $('#zoomName').textContent = file.replace('.png', '');
  $('#zoomImg').src = file;
  applyZoom('fit');
  $('#zoomStage').scrollTo(0, 0);
  renderZoomPins();
  $('#zoom').showModal();
}

$('#zoomImg').onclick = (e) => {
  if (pinch || Date.now() - gestureEndedAt < 400) return;
  const r = e.currentTarget.getBoundingClientRect();
  const x = Math.round(((e.clientX - r.left) / r.width) * 1000) / 10;
  const y = Math.round(((e.clientY - r.top) / r.height) * 1000) / 10;
  const { itemId, file } = zoomCtx;
  state[itemId] = { ...(state[itemId] || {}), pins: [...pinsOf(itemId), { image: file, x, y, note: '' }] };
  savePins(itemId);
  renderZoomPins();
  const inputs = $('#zoomPins').querySelectorAll('input');
  inputs[inputs.length - 1]?.focus();
};
$('#zoomClose').onclick = () => $('#zoom').close();
$('#zoom').addEventListener('click', (e) => { if (e.target === $('#zoom')) $('#zoom').close(); });
$('#zoom').addEventListener('close', () => render());

function render() {
  const root = $('#items');
  root.textContent = '';
  for (const it of ITEMS) {
    const sec = document.createElement('section');
    sec.className = 'item';
    sec.innerHTML = `<h2><span class="k">${ITEMS.indexOf(it) + 1}</span><span></span></h2><ul class="changes"></ul><div class="shots"></div>
      <div class="verdict"></div><textarea id="memo-${it.id}" rows="1" placeholder="한 줄 의견 (선택)"></textarea>`;
    sec.querySelector('h2 span:last-child').textContent = it.title;
    const ul = sec.querySelector('.changes');
    it.changes.forEach((c) => { const li = document.createElement('li'); li.textContent = c; ul.append(li); });
    const shots = sec.querySelector('.shots');
    it.before.forEach((f) => shots.append(shot(f, 'before', it.id)));
    it.after.forEach((f) => shots.append(shot(f, 'after', it.id)));
    const v = sec.querySelector('.verdict');
    for (const key of Object.keys(LABELS)) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.v = key; b.textContent = LABELS[key];
      b.setAttribute('aria-pressed', String(state[it.id]?.verdict === key));
      b.onclick = () => save(it.id, { verdict: key });
      v.append(b);
    }
    const saved = document.createElement('span');
    saved.className = 'saved'; saved.id = 'saved-' + it.id;
    v.append(saved);
    const ta = sec.querySelector('textarea');
    ta.value = state[it.id]?.memo ?? '';
    let t;
    ta.oninput = () => { clearTimeout(t); t = setTimeout(() => save(it.id, { memo: ta.value }), 600); };
    const pins = pinsOf(it.id);
    if (pins.length) {
      const ul2 = document.createElement('ul');
      ul2.className = 'pinsummary';
      pins.forEach((pin, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="num">${i + 1}</span>`;
        li.append(`${pin.image.replace('.png', '')}: ${pin.note || '(메모 없음)'}`);
        ul2.append(li);
      });
      sec.append(ul2);
    }
    root.append(sec);
  }
  updateCount();
}

function updateCount() {
  const n = ITEMS.filter((it) => state[it.id]?.verdict).length;
  $('#count').textContent = `${n} / ${ITEMS.length}`;
}

async function post(body) {
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(String(res.status));
}

async function save(id, patch) {
  state[id] = { ...(state[id] || {}), ...patch };
  if (patch.verdict) {
    const sec = $('#memo-' + id).closest('.item');
    sec.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === patch.verdict)));
    updateCount();
  }
  const el = $('#saved-' + id);
  el.textContent = '저장 중…';
  try {
    await post({ id, fields: { ...patch, title: ITEMS.find((i) => i.id === id)?.title ?? id } });
    el.textContent = '저장됨';
  } catch (e) { el.textContent = '저장 실패 — 리뷰 서버가 켜져 있는지 확인하세요'; }
}

let overallT;
$('#overall').oninput = () => {
  clearTimeout(overallT);
  overallT = setTimeout(() => post({ overall: $('#overall').value }).catch(() => {}), 600);
};
let autoOn = false;
let autoAtDone = false;
let finished = false;

function renderMode() {
  const time = (iso) => new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  const auto = finished ? autoAtDone : autoOn;
  $('#mode').dataset.auto = auto ? 'on' : 'off';
  if (auto && finished) {
    $('#modeTitle').textContent = `자동 이어가기 · ${watch.agent}가 피드백을 받아 작업을 이어갑니다`;
    $('#modeSub').textContent = '터미널에 보낼 메시지는 없습니다.';
  } else if (auto) {
    $('#modeTitle').textContent = `자동 이어가기 켜짐 · ${watch.agent}가 기다리는 중 (${time(watch.expiresAt)}까지)`;
    $('#modeSub').textContent = '완료 표시만 누르면 바로 이어서 작업합니다. 터미널에 메시지를 보낼 필요가 없습니다.';
  } else {
    $('#modeTitle').textContent = '자동 이어가기 꺼짐';
    $('#modeSub').textContent = '완료 표시를 누른 뒤 터미널에 "피드백 확인해"라고 보내야 작업이 이어집니다.';
  }
  if (!finished) {
    $('#doneNote').textContent = autoOn
      ? '다 봤으면 완료를 누르세요. 터미널 메시지는 필요 없습니다.'
      : '다 봤으면 완료를 누르고, 터미널에 "피드백 확인해"라고 보내 주세요.';
  }
}

let watch = {};
async function pollWatch() {
  try {
    watch = await (await fetch('/api/watch?round=' + REVIEW.round)).json();
    autoOn = watch.active === true;
  } catch { autoOn = false; }
  renderMode();
  if (typeof renderChat === 'function' && !$('#chat').hidden) renderChat();
}
pollWatch();
setInterval(pollWatch, 5000);

let chatMessages = [];
let transcript = { registered: false, items: [] };
let seenAt = '';
try { seenAt = localStorage.getItem('chatSeenAt-' + REVIEW.project) || ''; } catch {}

// 대화 창 = 세션 터미널 대화(등록돼 있으면) + 페이지·앱 화면에서 보낸 메시지를 시간순으로 합친 것
function timeline() {
  const fromPage = chatMessages.map((m) => ({ ...m, source: m.context === 'terminal' ? 'terminal' : m.context === 'app' ? 'app' : 'review' }));
  const fromTerminal = transcript.registered
    ? transcript.items.map((m) => ({ id: 't' + m.id, from: m.role, text: m.text, at: m.at, source: 'terminal', agent: transcript.agent }))
    : [];
  return [...fromTerminal, ...fromPage].sort((a, b) => String(a.at).localeCompare(String(b.at)));
}

// 에이전트 답의 간단한 마크다운(굵게, 코드)만 표시한다. 먼저 HTML을 이스케이프해서 안전하게 만든다.
function mdLite(text) {
  const esc = text.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  return esc
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^#{1,6}\s+(.+)$/gm, '<strong>$1</strong>');
}

function renderChat() {
  const box = $('#msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.textContent = '';
  const items = timeline();
  if (items.length === 0) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '평가하기 전에 궁금한 점을 물어보세요.\n작업 중인 시스템에 대한 것과 스킬(리뷰 페이지·진행 방식)에 대한 것을 아래에서 골라 보냅니다.';
    p.style.whiteSpace = 'pre-line';
    box.append(p);
  }
  let lastDay = '';
  for (const m of items) {
    const day = new Date(m.at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short' });
    if (day !== lastDay) {
      const d = document.createElement('p');
      d.className = 'divider';
      d.textContent = day;
      box.append(d);
      lastDay = day;
    }
    const div = document.createElement('div');
    div.className = 'msg ' + m.from;
    const tag = document.createElement('span');
    tag.className = 'tag';
    const where = m.source === 'terminal' ? '터미널' : m.source === 'app' ? '앱 화면' : '리뷰';
    tag.textContent = m.source === 'terminal' ? where : `${where} · ${m.target === 'skill' ? '스킬' : '시스템'}`;
    const body = document.createElement('span');
    body.innerHTML = mdLite(m.text);
    div.append(tag, body);
    const t = document.createElement('time');
    t.textContent = (m.from === 'agent' ? (m.agent || '작업 세션') + ' · ' : '') +
      new Date(m.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + (m.round ? ` · ${m.round}차` : '');
    div.append(t);
    box.append(div);
  }
  const last = items[items.length - 1];
  if (last && last.from === 'user' && last.source !== 'terminal') {
    const w = document.createElement('p');
    w.className = 'waiting';
    w.textContent = autoOn ? '작업 세션이 읽고 답하는 중…' : '자동으로 전달되지 않습니다. 터미널에 "대화 확인해"라고 보내 주세요.';
    box.append(w);
  }
  if (nearBottom) box.scrollTop = box.scrollHeight;
  $('#chatMode').dataset.auto = autoOn ? 'on' : 'off';
  const mirror = transcript.registered || chatMessages.some((m) => m.context === 'terminal') ? '터미널 대화가 함께 보입니다. ' : '';
  $('#chatMode').textContent = autoOn
    ? `${mirror}여기서 보낸 메시지는 바로 전달되고, 작업 세션(${watch.agent})이 답합니다. 작업 중이면 끝난 뒤 답합니다.`
    : `${mirror}여기서 보낸 메시지는 자동으로 전달되지 않습니다. 보낸 뒤 터미널에 "대화 확인해"라고 알려 주세요.`;
  const open = !$('#chat').hidden;
  if (open && last) {
    seenAt = String(last.at);
    try { localStorage.setItem('chatSeenAt-' + REVIEW.project, seenAt); } catch {}
  }
  const unread = items.filter((m) => m.from === 'agent' && String(m.at) > seenAt).length;
  $('#chatBadge').hidden = unread === 0;
  $('#chatBadge').textContent = String(unread);
}

let chatKey = '';
async function pollChat() {
  try {
    const [c, t] = await Promise.all([fetch('/api/chat').then((r) => r.json()), fetch('/api/transcript').then((r) => r.json())]);
    chatMessages = c.messages || [];
    transcript = t;
    if (!seenAt) {
      const items = timeline();
      seenAt = items.length ? String(items[items.length - 1].at) : '0';
    }
    const key = chatMessages.length + ':' + (t.items || []).length + ':' + ((t.items || []).slice(-1)[0]?.id || '');
    if (key !== chatKey) {
      chatKey = key;
      renderChat();
    }
  } catch {}
}

$('#chatBtn').onclick = () => {
  const open = $('#chat').hidden;
  $('#chat').hidden = !open;
  $('#chatBtn').setAttribute('aria-expanded', String(open));
  renderChat();
  if (open) {
    $('#msgs').scrollTop = $('#msgs').scrollHeight;
    $('#chatInput').focus();
  }
};

let chatTarget = 'system';
document.querySelectorAll('[data-target]').forEach((b) => {
  b.onclick = () => {
    chatTarget = b.dataset.target;
    document.querySelectorAll('[data-target]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    $('#chatInput').placeholder = chatTarget === 'skill'
      ? '스킬에 대한 의견 · Enter 보내기'
      : '질문이나 요청 · Enter 보내기';
    $('#chatInput').focus();
  };
});

$('#compose').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('#chatInput').value.trim();
  if (!text) return;
  $('#chatInput').value = '';
  try {
    await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: 'user', text, round: REVIEW.round, target: chatTarget, context: 'review' }) });
    await pollChat();
    $('#msgs').scrollTop = $('#msgs').scrollHeight;
  } catch {
    $('#chatInput').value = text;
  }
};

$('#chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $('#compose').requestSubmit();
  }
});

pollChat();
setInterval(pollChat, 3000);

$('#done').onclick = async () => {
  $('#done').disabled = true;
  finished = true;
  autoAtDone = autoOn;
  try {
    await post({ done: true });
    renderMode();
    $('#doneNote').textContent = autoAtDone
      ? `완료로 표시했습니다. ${watch.agent}가 이어서 작업합니다. 터미널에 보낼 메시지는 없습니다.`
      : '완료로 표시했습니다. 이제 터미널에 "피드백 확인해"라고 보내 주세요.';
  } catch (e) { finished = false; $('#doneNote').textContent = '저장 실패 — 리뷰 서버가 켜져 있는지 확인하세요.'; $('#done').disabled = false; }
};

$('#title').textContent = document.title;
$('#eyebrow').textContent = `${REVIEW.project} · ${REVIEW.round}차 리뷰`;
render();

(async () => {
  try {
    const res = await fetch(API);
    const data = await res.json();
    Object.assign(state, data.items || {});
    $('#overall').value = data.overall || '';
    if (data.done) { finished = true; $('#done').disabled = true; $('#doneNote').textContent = '이미 완료로 표시된 리뷰입니다. 작업이 이어지지 않았다면 터미널에 "피드백 확인해"라고 보내 주세요.'; }
    $('#conn').textContent = '선택하면 자동 저장됩니다.';
    render();
  } catch (e) { $('#conn').textContent = '리뷰 서버에 연결되지 않았습니다. 터미널에서 서버를 켜 주세요.'; }
})();
</script>
</html>
